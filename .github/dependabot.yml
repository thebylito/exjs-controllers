version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Documentation site (Next.js + Fumadocs). docs/ has no committed lockfile
  # (root .gitignore ignores package-lock.json), so Dependabot can only bump
  # the ranges in docs/package.json. CI does not build the site: check manually.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    versioning-strategy: increase
    groups:
      docs-dependencies:
        patterns: ['*']
    commit-message:
      prefix: 'chore(docs-deps)'
