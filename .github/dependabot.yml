version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Documentation site (Next.js + Fumadocs), an independent Yarn project with
  # its own docs/yarn.lock. PRs are validated by the build job in docs.yml.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docs-dependencies:
        patterns: ['*']
    commit-message:
      prefix: 'chore(docs-deps)'
