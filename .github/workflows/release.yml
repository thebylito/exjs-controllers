name: Release

# Triggered by pushing a tag like v0.10.0 (see RELEASING.md).
# Two jobs: `build` runs the tests and packs the tarball without any publish
# rights; `publish` waits for approval of the protected `npm` environment, then
# publishes the prebuilt tarball to npm via Trusted Publishing (OIDC, no token)
# and creates the GitHub Release with the matching CHANGELOG.md section as notes.
on:
  push:
    tags: ['v*']

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: npm install -g corepack@0.36.0 && corepack enable

      # Node 24 bundles npm >= 11.5.1, required for OIDC publishing.
      # No `registry-url` here: it would write an _authToken entry to .npmrc
      # and OIDC must run without NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: yarn

      - name: Check tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      # Fails before publishing if CHANGELOG.md has no section for this version.
      - name: Extract release notes from CHANGELOG.md
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test

      - name: Pack tarball
        run: npm pack --ignore-scripts

      # Dry run only validates the tarball; it needs no OIDC or token.
      - name: Dry-run publish
        run: npm publish --dry-run --ignore-scripts ./exjs-controllers-*.tgz

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: |
            exjs-controllers-*.tgz
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    # Protected environment: waits for the required reviewer (see RELEASING.md).
    environment: npm
    permissions:
      id-token: write # npm trusted publishing (OIDC)
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: npm install -g corepack@0.36.0 && corepack enable

      # Node 24 bundles npm >= 11.5.1, required for OIDC publishing.
      # No `registry-url` here: it would write an _authToken entry to .npmrc
      # and OIDC must run without NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release

      - name: Publish to npm
        run: npm publish --provenance --access public "./exjs-controllers-${GITHUB_REF_NAME#v}.tgz"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            ./*.tgz
